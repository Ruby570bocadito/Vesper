syntax = "proto3";

package vesper.v1;

option go_package = "github.com/ruby570bocadito/vesper/pkg/proto/gen/bridge;bridgev1";

// BridgeService enables Go agent to call Python modules via IPC
service BridgeService {
  // Execute a Python module function
  rpc ExecuteModule(ModuleRequest) returns (ModuleResponse);

  // Stream AI analysis results
  rpc AIAnalyze(AIAnalyzeRequest) returns (stream AIAnalyzeResponse);

  // Stream recon results
  rpc ReconStream(ReconRequest) returns (stream ReconResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message ModuleRequest {
  string module_name = 1;
  string function_name = 2;
  bytes payload = 3;
  int64 timeout_ms = 4;
}

message ModuleResponse {
  bool success = 1;
  bytes result = 2;
  string error = 3;
  int64 elapsed_ms = 4;
}

message AIAnalyzeRequest {
  string context = 1;
  string target_data = 2;
  string model = 3;
  map<string, string> options = 4;
}

message AIAnalyzeResponse {
  string suggestion = 1;
  string tactic = 2;
  string technique = 3;
  string mitre_id = 4;
  float confidence = 5;
  string reasoning = 6;
  string raw_response = 7;
}

message ReconRequest {
  string target = 1;
  string mode = 2;
  repeated string tools = 3;
}

message ReconResponse {
  string host = 1;
  int32 port = 2;
  string service = 3;
  string version = 4;
  string vulnerability = 5;
  string cve = 6;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ok = 1;
  string module_name = 2;
  string version = 3;
}
