# VESPER Framework — Docker Lab
# ===============================
# Multi-container lab environment for safe testing.
#
# Containers:
#   - attacker:  Operator workstation (Go agent, Python modules, CLI)
#   - target1:   Ubuntu 24.04 with deliberate vulnerabilities
#   - target2:   Windows Server 2019 (if available)
#   - dashboard: Vue 3 web dashboard (:3000)
#   - ollama:    Local LLM service for AI modules (:11434)
#
# Network: 172.20.0.0/24 (isolated)

version: "3.9"

services:
  attacker:
    build:
      context: ..
      dockerfile: lab/Dockerfile.attacker
    container_name: vesper-attacker
    hostname: attacker
    networks:
      lab_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ..:/opt/vesper
      - attacker_data:/root
    working_dir: /opt/vesper
    command: ["sleep", "infinity"]
    depends_on:
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "test -d /opt/vesper && test -x /opt/vesper/vesper"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  target1:
    build:
      context: ..
      dockerfile: lab/Dockerfile.target-linux
    container_name: vesper-target1
    hostname: target1
    networks:
      lab_net:
        ipv4_address: 172.20.0.20
    volumes:
      - target1_data:/data
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  target2:
    build:
      context: ..
      dockerfile: lab/Dockerfile.target-linux
    container_name: vesper-target2
    hostname: target2
    networks:
      lab_net:
        ipv4_address: 172.20.0.21
    volumes:
      - target2_data:/data
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: node:20-alpine
    container_name: vesper-dashboard
    hostname: dashboard
    networks:
      lab_net:
        ipv4_address: 172.20.0.30
    ports:
      - "3000:3000"
    working_dir: /app
    command: ["npx", "serve", "-l", "3000", "--no-clipboard"]
    volumes:
      - dashboard_data:/app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: vesper-ollama
    hostname: ollama
    networks:
      lab_net:
        ipv4_address: 172.20.0.40
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:11434 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  attacker_data:
  target1_data:
  target2_data:
  dashboard_data:
  ollama_data:
