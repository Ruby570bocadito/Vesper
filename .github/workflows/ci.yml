name: Vesper CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build binaries (CLI + implant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: go mod verify
        run: go mod verify
      - name: Build everything (this is what catches breakage)
        run: go build ./...
      - name: Build CLI
        run: go build -o dist/vesper ./cmd/vesper
      - name: Build implant beacon
        run: go build -o dist/implant ./cmd/implant
      - name: Smoke test CLI
        run: |
          ./dist/vesper help
          ./dist/vesper version
      - uses: actions/upload-artifact@v4
        with:
          name: vesper-binaries
          path: dist/

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: Run all tests
        run: go test ./... -cover -timeout 180s

  lint:
    name: go vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l cmd internal pkg plugins)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  bridge:
    name: Python bridge tests (sandboxed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Safety sandbox tests
        run: cd modules/bridge && python3 -m pytest tests/ -v --tb=short
      - name: Repo must stay clean after tests
        run: |
          if [ -n "$(git status --porcelain modules/ pkg/)" ]; then
            echo "::error::bridge tests mutated tracked files:"
            git status --porcelain modules/ pkg/
            exit 1
          fi

  dashboard:
    name: Vue dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + build
        run: cd web && npm ci && npm run build

  config:
    name: Config + proto consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Validate config.yaml parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('config.yaml')); print('config.yaml OK')"
      - name: Proto files parse (protoc dry parse)
        uses: arduino/setup-protoc@v3
        with:
          version: '27.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc parse check
        run: |
          for p in pkg/proto/*.proto; do
            protoc --proto_path=pkg/proto --descriptor_set_out=/dev/null "$p"
          done
          echo "protos OK"
