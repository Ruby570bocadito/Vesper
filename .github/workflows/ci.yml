name: Vesper CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build binaries (CLI + implant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: go mod verify
        run: go mod verify
      - name: Build everything (this is what catches breakage)
        run: go build ./...
      - name: Build CLI
        run: go build -o dist/vesper ./cmd/vesper
      - name: Build implant beacon
        run: go build -o dist/implant ./cmd/implant
      - name: Smoke test CLI
        run: |
          ./dist/vesper help
          ./dist/vesper version
      - uses: actions/upload-artifact@v4
        with:
          name: vesper-binaries
          path: dist/

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: Run all tests
        run: go test ./... -cover -timeout 180s

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: go test -race
        run: go test -race ./... -timeout 300s

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout 5m

  coverage:
    name: Coverage (Go + Python)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Go coverage
        run: go test ./... -coverprofile=go.cov -covermode=atomic -timeout 180s
      - name: Go total
        run: echo "GO_COV=$(go tool cover -func=go.cov | awk '/^total/ {print substr($3, 1, length($3)-1)}')" >> "$GITHUB_ENV"
      - name: Python coverage
        run: |
          pip install pytest pytest-cov
          python3 -m pytest modules/bridge/tests/ --cov=modules.bridge --cov-report=json:py.cov -q
          PY_COV=$(python3 -c "import json; print(json.load(open('py.cov'))['totals']['percent_covered_display'])")
          echo "PY_COV=$PY_COV" >> "$GITHUB_ENV"
      - name: Combined badge
        run: |
          AVG=$(python3 -c "print(round(($GO_COV + float($PY_COV)) / 2, 1))")
          if (( $(echo "$AVG >= 75" | bc -l) )); then COLOR=brightgreen
          elif (( $(echo "$AVG >= 50" | bc -l) )); then COLOR=orange
          else COLOR=red; fi
          echo "coverage: $AVG% | go: $GO_COV% | py: $PY_COV%"
          python3 - <<EOF
          svg = '''<svg xmlns="http://www.w3.org/2000/svg" width="230" height="20" role="img">
            <linearGradient id="g" x2="0" y2="100%"><stop offset="0" stop-color="#bbb"/><stop offset="1" stop-color="#888"/></linearGradient>
            <clipPath id="r"><rect width="230" height="20" rx="3"/></clipPath>
            <g clip-path="url(#r)"><rect width="130" height="20" fill="#555"/><rect x="130" width="100" height="20" fill="$COLOR"/></g>
            <text fill="#fff" font-family="Verdana" font-size="11" x="6" y="14">coverage</text>
            <text fill="#fff" font-family="Verdana" font-size="11" x="136" y="14">$AVG%</text>
          </svg>'''
          open('docs/coverage.svg', 'w').write(svg)
          EOF
      - name: Commit badge if changed
        run: |
          git config user.name "vesper-ci"
          git config user.email "ci@vesper.local"
          git add docs/coverage.svg
          if git diff --cached --quiet; then
            echo "badge unchanged"
          else
            git commit -m "ci: update coverage badge [skip ci]"
            git push
          fi

  bridge:
    name: Python bridge tests (sandboxed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Safety sandbox tests
        run: cd modules/bridge && python3 -m pytest tests/ -v --tb=short
      - name: Repo must stay clean after tests
        run: |
          if [ -n "$(git status --porcelain modules/ pkg/)" ]; then
            echo "::error::bridge tests mutated tracked files:"
            git status --porcelain modules/ pkg/
            exit 1
          fi

  dashboard:
    name: Vue dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + build
        run: cd web && npm ci && npm run build

  config:
    name: Config + proto consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Validate config.yaml parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('config.yaml')); print('config.yaml OK')"
      - name: Proto files parse (protoc dry parse)
        uses: arduino/setup-protoc@v3
        with:
          version: '27.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: protoc parse check
        run: |
          for p in pkg/proto/*.proto; do
            protoc --proto_path=pkg/proto --descriptor_set_out=/dev/null "$p"
          done
          echo "protos OK"
